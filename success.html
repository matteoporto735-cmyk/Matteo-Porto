<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Download ebook — FitBooks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="success-page">
  <main class="success-card">
    <span class="success-icon">✓</span>
    <span class="eyebrow">PAGAMENTO CONFERMATO</span>
    <h1>I tuoi ebook sono pronti.</h1>
    <p id="successText">Stiamo verificando il pagamento con Stripe…</p>
    <div id="successOrder" class="success-order" hidden></div>
    <div id="downloadArea" class="download-area"></div>
    <div class="success-notice">
      <strong>Download protetto</strong>
      <p>I pulsanti di download vengono generati solo dopo la verifica del pagamento. I link sono temporanei: se scadono, ricarica questa pagina per generarne di nuovi.</p>
    </div>
    <a class="btn secondary" href="index.html#catalogo">Torna al negozio</a>
  </main>
  <script src="success.js"></script>
</body>
</html>
